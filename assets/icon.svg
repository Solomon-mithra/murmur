<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/><stop offset="1" stop-color="#ffe98a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7a5a00" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px tile -->
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/></g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="3"/>
  <!-- voice: waveform capsules, the split pair is voice turning into words; then the text cursor -->
  <g transform="translate(512 512) scale(1.0) translate(-512 -512) translate(-9 0)" fill="#1a1a1a">
    <rect x="240" y="362" width="120" height="300" rx="60"/>
    <rect x="384" y="252" width="120" height="520" rx="60"/>
    <rect x="528" y="312" width="120" height="194" rx="60"/>
    <rect x="528" y="518" width="120" height="164" rx="60"/>
    <rect x="698" y="282" width="48" height="460" rx="24" fill="#ff5c39"/>
  </g>
</svg>
